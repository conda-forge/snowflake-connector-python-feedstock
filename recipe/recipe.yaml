schema_version: 1

context:
  name: snowflake-connector-python
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/snowflake_connector_python-${{ version }}.tar.gz
  sha256: 94677d66208a3b1626324e0b9312b577cab99f6431b21aee19b24c9ec9acf648
  patches:
    # cargo writes to <target-dir>/<triple>/release when CARGO_BUILD_TARGET is set
    - 0001-respect-CARGO_BUILD_TARGET.patch
    # upstream caps protobuf <7 for Snowflake's in-platform channel; the shipped
    # 6.32.1 gencode works with 7.x, and 6.x is not built for cp314t or cp315
    - 0002-allow-protobuf-7.patch

build:
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython >=3.1
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    # aws-lc-sys needs NASM on Windows x86-64 unless prebuilt objects are used
    - if: win
      then: nasm
  host:
    - python
    - pip
    - hatchling
    - setuptools
    - cython >=3.1
  run:
    - python
    - cryptography >=46.0.5
    - protobuf >=6.32.1,<8
    - pytz
    - tomlkit >=0.13
  run_constraints:
    # mirroring upstream [pandas] and [pyarrow] extras from pyproject.toml
    - if: match(python, "<3.13")
      then: pandas >=1.0.0,<3
      else: pandas >=2.1.2,<3
    - pyarrow >=14.0.1

tests:
  - python:
      pip_check: true
      imports:
        - snowflake.connector
        - snowflake.connector.aio
        - snowflake.connector._internal.arrow_stream_iterator
        - snowflake.connector._core.sf_core_python

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Snowflake Connector for Python
  description: |
    The Snowflake Connector for Python provides an interface for
    developing Python applications that can connect to Snowflake
    and perform all standard operations. It provides a programming
    alternative to developing applications in Java or C/C++ using
    the Snowflake JDBC or ODBC drivers.
  homepage: https://github.com/snowflakedb/drivers
  repository: https://github.com/snowflakedb/drivers
  documentation: https://docs.snowflake.com/en/developer-guide/python-connector/python-connector

extra:
  recipe-maintainers:
    - hajapy
    - talues
    - xhochy
    - mariusvniekerk
    - fhoehle
